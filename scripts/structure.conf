# structure.conf -- single source of truth for the Class 10 CBSE folder tree.
#
# One relative directory path per line, from the repository root. Blank lines
# and lines starting with '#' are ignored. scripts/build_structure.sh creates
# every path listed here (plus a .gitkeep in each empty leaf) and
# scripts/verify_structure.sh checks that every path still exists.
#
# Subject folders live under study/ so the repository root only holds that
# tree plus the website (site/, docs/, assets/, scripts/, tests/).
#
# Folder naming convention:
#   NN-Name            two-digit order prefix + hyphen-separated title
#   chNN-Name          chapter folder, numbered as in the NCERT textbook
#   unitN-Name         unit folder (skill subjects)

